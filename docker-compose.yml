services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salereport
      POSTGRES_PASSWORD: salereport
      POSTGRES_DB: salereport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sale-report-api/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salereport -d salereport"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./sale-report-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./sale-report-api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./sale-report-web
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "5173:5173"
    volumes:
      - ./sale-report-web/src:/app/src
      - ./sale-report-web/index.html:/app/index.html
    depends_on:
      - api

volumes:
  pgdata:
